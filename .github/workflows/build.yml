name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41'
          channel: 'stable'

      - name: Generate platform files
        run: |
          cd ..
          flutter create --project-name timer_overlay_app --org com.timer temp_project
          # copy generated android files (gradle, build config) but keep our AndroidManifest
          mv timer_overlay_app/android timer_overlay_app/android_repo
          cp -r temp_project/android timer_overlay_app/android
          cp -r temp_project/ios timer_overlay_app/ 2>/dev/null || true
          cp -r temp_project/web timer_overlay_app/ 2>/dev/null || true
          cp temp_project/analysis_options.yaml timer_overlay_app/ 2>/dev/null || true
          # restore our custom AndroidManifest
          cp timer_overlay_app/android_repo/app/src/main/AndroidManifest.xml timer_overlay_app/android/app/src/main/AndroidManifest.xml
          rm -rf timer_overlay_app/android_repo

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
