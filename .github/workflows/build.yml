name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41'
          channel: 'stable'

      - name: Generate platform files
        run: |
          cd ..
          flutter create --project-name timer_overlay_app --org com.timer temp_project
          cp -r temp_project/android timer_overlay_app/
          cp -r temp_project/ios timer_overlay_app/ 2>/dev/null || true
          cp -r temp_project/web timer_overlay_app/ 2>/dev/null || true

      - name: Add overlay permissions to AndroidManifest
        run: |
          cd android/app/src/main
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n</manifest>|' AndroidManifest.xml

      - name: Copy home screen widget files
        run: |
          # Copy widget layouts & info xml
          cp -r widget_assets/res/* android/app/src/main/res/
          # Copy widget Kotlin provider
          mkdir -p android/app/src/main/kotlin/com/timer/timer_overlay_app
          cp widget_assets/kotlin/DayCounterWidgetProvider.kt android/app/src/main/kotlin/com/timer/timer_overlay_app/
          cp widget_assets/kotlin/MainActivity.kt android/app/src/main/kotlin/com/timer/timer_overlay_app/
          # Add widget receiver to AndroidManifest (before closing application tag)
          cd android/app/src/main
          sed -i 's|</application>|<receiver android:name=".DayCounterWidgetProvider" android:exported="true">\n<intent-filter>\n<action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n</intent-filter>\n<meta-data android:name="android.appwidget.provider" android:resource="@xml/day_counter_info" />\n</receiver>\n</application>|' AndroidManifest.xml

      - run: flutter pub get
      - name: Run flutter tests
        continue-on-error: true
        run: |
          set +eo pipefail
          flutter test test/overlay_test.dart --reporter json 2>&1 | tee test_output.json
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_ENV
          python3 -c "
import json, sys
for line in open('test_output.json'):
    line = line.strip()
    if not line: continue
    try:
        ev = json.loads(line)
        if ev.get('type') == 'testDone' and ev.get('result') != 'success':
            print(f'::error file=test/overlay_test.dart::TEST FAILED: {ev.get(\"test\",\"?\")}')
        if ev.get('type') == 'error':
            msg = ev.get('error', ev.get('message', str(ev)))[:500]
            print(f'::error file=test/overlay_test.dart::{msg}')
    except:
        pass
"
          exit $exit_code
      - run: flutter build apk --release
        if: env.exit_code == '0'

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
