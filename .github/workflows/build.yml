name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41'
          channel: 'stable'

      - name: Generate platform files
        run: |
          cd ..
          flutter create --project-name timer_overlay_app --org com.timer timer_overlay_app_temp
          cp -r timer_overlay_app_temp/android timer_overlay_app/
          cp -r timer_overlay_app_temp/ios timer_overlay_app/ 2>/dev/null || true
          cp -r timer_overlay_app_temp/web timer_overlay_app/ 2>/dev/null || true
          cp timer_overlay_app_temp/analysis_options.yaml timer_overlay_app/ 2>/dev/null || true
          cd timer_overlay_app

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
